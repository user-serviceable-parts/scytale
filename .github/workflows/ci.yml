name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # A CI build is built once and thrown away, so the incremental
  # artifacts are written and never read.
  CARGO_INCREMENTAL: 0
  # The vectors are in the checkout. A suite that cannot find them
  # skips and passes, so here not finding them is a failure.
  SCYTALE_VECTORS: required

jobs:
  # Every architecture runs its own tests natively: no emulation, so
  # the assembly is exercised on real hardware. The vendored vector
  # files are in the checkout, so the full suites run.
  #
  # The RISC-V runners are the RISE ones, installed as a GitHub App.
  test:
    name: test (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both runners have every extension the library uses, and
          # the inventory holds them to it: one that lacks something
          # fails there instead of skipping rows in silence. On x86
          # that is also the only test of the wide GCM rows, since
          # QEMU does not emulate VPCLMULQDQ.
          - arch: x86-64
            runner: ubuntu-latest
            expect_all: 1
          - arch: arm64
            runner: ubuntu-24.04-arm
            expect_all: 1
          # The RISE runner is off until the RVA23 machines arrive:
          # it has no extension the library uses, so it tests only
          # the portable code, which the emulated jobs test in a
          # tenth of the time. Clippy for the target runs there.
          # - arch: riscv64
          #   runner: ubuntu-24.04-riscv
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: |
          if command -v rustup > /dev/null; then
              rustup update --no-self-update stable
              rustup default stable
              rustup component add clippy
          else
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
                  | sh -s -- -y --profile minimal \
                        --default-toolchain stable --component clippy
              echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi

      # The compiled dependencies, keyed on the lock file and kept
      # between runs; the workspace crates are rebuilt every time,
      # since they change. Jobs that build the same thing share one
      # key, and one of them saves it at the end of the job, so
      # sixteen shards do not upload sixteen copies. Only actions
      # GitHub owns are allowed here, which rules out rust-cache.
      - uses: actions/cache/restore@v6
        id: cache
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: >-
            native-${{ matrix.arch }}-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Report toolchain and processor
        run: |
          uname -m
          cargo --version
          rustc --version --verbose
          # The extensions the run-time probes look for: `isa` on
          # RISC-V, `Features` on AArch64, `flags` on x86-64.
          grep -m1 -E '^(isa|Features|flags)' /proc/cpuinfo || true

      - name: Test
        # Every crate's tests, once. Of scytale-acvp only its own
        # unit tests: the check against the vendored vectors is its
        # `vendored` test and has jobs of its own below.
        run: |
          cargo test --release --workspace --exclude scytale-acvp \
              -- --skip vectors::inventory
          cargo test --release -p scytale-acvp --lib --bins

      - name: Test with the features in force edited
        # These change a process-wide setting, so they are ignored by
        # default and run here alone, single-threaded. The second is
        # where the kernels with no ACVP suite, below the one the
        # processor picks, answer their vectors.
        run: |
          cargo test --release -p scytale --lib -- \
              features::tests::alone vectors::alone \
              --ignored --test-threads=1

      - name: Implementations tested
        # The binary is built by now, so this costs a second and
        # says which implementations this processor could run. The
        # suites live in the library's own test build, since an
        # integration test cannot see the implementations. The runs
        # above skip it, so this is its only run.
        run: cargo test --release --lib vectors::inventory -- --nocapture
        env:
          SCYTALE_EXPECT_ALL: ${{ matrix.expect_all }}

      - name: Clippy
        # The same profile as the tests, so this analyses the code
        # rather than building a second tree of it.
        run: |
          cargo clippy --workspace --all-targets --release \
              -- -D warnings

      - name: Docs
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      - uses: actions/cache/save@v6
        # Saved once per key, by one job of those that share it.
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ steps.cache.outputs.cache-primary-key }}

  # The check against the vendored vectors on the native runners:
  # every suite in full, and every kernel the processor can run
  # answering the vectors that test it, each exactly once; see
  # scytale-acvp/README.md. The work is spread over jobs by
  # SCYTALE_SHARD, each taking an equal share by weight. Only the
  # `vendored` test runs here: the crate's unit tests run once, in
  # the job above.
  vendored:
    name: test (${{ matrix.arch }}, shard ${{ matrix.shard }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86-64
            runner: ubuntu-latest
            shard: 1/1
          - arch: arm64
            runner: ubuntu-24.04-arm
            shard: 1/1
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: |
          if command -v rustup > /dev/null; then
              rustup update --no-self-update stable
              rustup default stable
          else
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
                  | sh -s -- -y --profile minimal \
                        --default-toolchain stable
              echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi

      - uses: actions/cache/restore@v6
        id: cache
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: >-
            vendored-${{ matrix.arch }}-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Test
        run: cargo test --release -p scytale-acvp --test vendored
        env:
          SCYTALE_SHARD: ${{ matrix.shard }}

      - uses: actions/cache/save@v6
        # Saved once per key, by one job of those that share it.
        if: ${{ startsWith(matrix.shard, '1/') && steps.cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ steps.cache.outputs.cache-primary-key }}

  # The same check for RISC-V, which has no native runner: under
  # QEMU's `max` processor, which has every extension the library
  # uses, so every RISC-V kernel answers the vectors that test it.
  # Under emulation that is too long for one job, so the run is
  # spread over the shards listed here, each taking an equal share by
  # weight; the count is the one number in the list. Each log says
  # the weight it took of the whole. More shards than these would not
  # finish sooner: the tallest LMS tree is one case of some
  # twenty-five minutes on one core, and a shard is done no earlier
  # than its longest case.
  #
  # The container is for its QEMU, as below. The arm64 runners are
  # an experiment: on the x86-64 pool two or three shards a run took
  # three times as long as the same shards in other runs, every suite
  # and the compile alike, which the steps around the test measure.
  vendored-emulated:
    name: test (riscv64, max, shard ${{ matrix.shard }})
    runs-on: ubuntu-24.04-arm
    container: debian:trixie
    strategy:
      fail-fast: false
      matrix:
        shard:
          - 1/6
          - 2/6
          - 3/6
          - 4/6
          - 5/6
          - 6/6
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust, QEMU and the cross linker
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
              ca-certificates curl gcc libc6-dev qemu-user zstd \
              gcc-riscv64-linux-gnu libc6-dev-riscv64-cross
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal \
                    --default-toolchain stable \
                    --target riscv64gc-unknown-linux-gnu
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - uses: actions/cache/restore@v6
        id: cache
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: >-
            vendored-riscv64-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Measure the machine
        # The processor, the cores, the kernel's cpu counters (steal
        # is the eighth field) and a fixed native hash, so a slow
        # shard can be told from a slow machine.
        shell: bash
        run: |
          uname -m; nproc
          grep -m1 -E 'model name|^CPU part' /proc/cpuinfo || true
          head -1 /proc/stat
          time (head -c 1G /dev/zero | sha256sum)

      - name: Test as max, shard ${{ matrix.shard }}
        # Without the session, which would want the target's TLS
        # library.
        run: |
          cargo test --release -p scytale-acvp --no-default-features \
              --test vendored --target riscv64gc-unknown-linux-gnu
        env:
          CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_GNU_LINKER:
            riscv64-linux-gnu-gcc
          CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_GNU_RUNNER:
            qemu-riscv64 -cpu max -L /usr/riscv64-linux-gnu
          SCYTALE_SHARD: ${{ matrix.shard }}

      - name: Measure the machine after
        # The processor, the cores, the kernel's cpu counters (steal
        # is the eighth field) and a fixed native hash, so a slow
        # shard can be told from a slow machine.
        shell: bash
        if: ${{ always() }}
        run: |
          uname -m; nproc
          grep -m1 -E 'model name|^CPU part' /proc/cpuinfo || true
          head -1 /proc/stat
          time (head -c 1G /dev/zero | sha256sum)

      - uses: actions/cache/save@v6
        # Saved once per key, by one job of those that share it.
        if: ${{ startsWith(matrix.shard, '1/') && steps.cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ steps.cache.outputs.cache-primary-key }}

  # Thirty-two bits. Every other target tested here has a sixty-four
  # bit `usize`, and a length or a counter held in one behaves
  # differently at half the width: the counter mode's room before its
  # counter wraps was once computed in a `usize` and came out as zero
  # here. It has no loops written out for it, so this is also the run
  # of the build that has nothing but the portable code.
  #
  # It is 32-bit x86, which the runner's processor executes itself,
  # and the musl target because that one brings its own C library and
  # start-up files, and the linker is the one rustc ships, so nothing
  # 32-bit has to be installed. WebAssembly is the same portable code
  # at the same width, so it is built, in other-targets below, and
  # not tested again.
  narrow:
    name: test (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # One row for the library's tests and the lints and, apart
          # from it, the check against the vendored vectors in
          # shards, which carry nothing else.
          - name: x86, 32-bit
            target: i686-unknown-linux-musl
          - name: x86, 32-bit, shard 1/2
            target: i686-unknown-linux-musl
            shard: 1/2
          - name: x86, 32-bit, shard 2/2
            target: i686-unknown-linux-musl
            shard: 2/2
    env:
      CARGO_TARGET_I686_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: |
          rustup update --no-self-update stable
          rustup default stable
          rustup component add clippy
          rustup target add ${{ matrix.target }}

      - uses: actions/cache/restore@v6
        id: cache
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: >-
            narrow-${{ matrix.target }}-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Test
        # As the native job, for a target. The inventory goes first
        # and alone so that its table is in the log, portable rows
        # though they all are.
        if: ${{ !matrix.shard }}
        run: |
          cargo test --release -p scytale --lib --target ${{ matrix.target }} \
              vectors::inventory -- --nocapture
          cargo test --release --workspace --exclude scytale-acvp \
              --target ${{ matrix.target }} -- --skip vectors::inventory
          cargo test --release -p scytale --lib --target ${{ matrix.target }} \
              -- features::tests::alone vectors::alone \
              --ignored --test-threads=1
        env:
          # Per target, because a plain RUSTFLAGS would replace these
          # rather than add to them and the linker flag would be lost.
          CARGO_TARGET_I686_UNKNOWN_LINUX_MUSL_RUSTFLAGS:
            -D warnings -C linker-flavor=ld.lld

      - name: Test the vendored vectors, shard ${{ matrix.shard }}
        # This shard's share of the check, and nothing else.
        if: ${{ matrix.shard }}
        run: |
          cargo test --release -p scytale-acvp --no-default-features \
              --test vendored --target ${{ matrix.target }}
        env:
          SCYTALE_SHARD: ${{ matrix.shard }}
          CARGO_TARGET_I686_UNKNOWN_LINUX_MUSL_RUSTFLAGS:
            -D warnings -C linker-flavor=ld.lld

      - name: Clippy
        # Some code is built only where there is no hardware backend,
        # and the targets above never show it to the lints.
        if: ${{ !matrix.shard }}
        run: |
          cargo clippy --workspace --exclude scytale-acvp --all-targets \
              --release --target ${{ matrix.target }} -- -D warnings
          cargo clippy -p scytale-acvp --no-default-features \
              --all-targets --release --target ${{ matrix.target }} \
              -- -D warnings
        env:
          CARGO_TARGET_I686_UNKNOWN_LINUX_MUSL_RUSTFLAGS:
            -C linker-flavor=ld.lld

      - uses: actions/cache/save@v6
        # Saved once per key, by the library row.
        if: ${{ !matrix.shard && steps.cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ steps.cache.outputs.cache-primary-key }}

  # Every runner here and every machine anyone develops on is a recent
  # processor, so which loop a lesser one is given is decided by code
  # that never runs: on real hardware only one answer to each probe is
  # ever seen. A probe that asks for less than its loop uses is then an
  # illegal instruction on the older part and a passing build here.
  # That happened: the narrow AES modes asked for AES-NI and were
  # VEX-encoded, which Westmere and the Silvermont and Goldmont Atoms
  # cannot run.
  #
  # So each set of features the probes tell apart gets a processor
  # here, emulated, and a dispatch check on it. `features` is what
  # that processor has, of the features any backend needs, and the
  # inventory test holds every probe to it in both directions: a
  # backend offered without its features fails, and so does one
  # withheld from a processor that has them, which would otherwise
  # pass in silence as a skipped test. It also checks the emulator
  # offers what is written here, so a list cannot go stale. Then the
  # tests that compare each kernel with the portable code run, which
  # all have `agree` in their names: every kernel the processor
  # reaches executes there, and one that traps fails the row.
  #
  # That is all a row proves, and all it runs: that the probes choose
  # the right kernels on that set of features, and that those kernels
  # run on that processor. Whether each kernel is right is settled
  # once, where every kernel can run: the library's tests and the
  # check against the vendored vectors on the native runners for
  # x86-64 and aarch64, and for RISC-V, which has no native runner,
  # under QEMU's `max` processor, in the row marked `whole` here and
  # the vendored-emulated job above.
  #
  # The container is for its QEMU: the runner's own is too old to
  # report the RISC-V cryptography extensions, and it lacks some of
  # the x86-64 ones.
  emulated:
    name: test (${{ matrix.arch }}, ${{ matrix.cpu }})
    runs-on: ubuntu-latest
    container: debian:trixie
    strategy:
      fail-fast: false
      matrix:
        include:
          # No AES-NI: everything portable, the probes saying no to
          # all of it.
          - arch: x86_64
            cpu: Nehalem
            features: ssse3 sse4.1
          # AES-NI without AVX.
          - arch: x86_64
            cpu: Westmere
            features: ssse3 sse4.1 aes pclmulqdq
          # AVX without AVX2 or BMI2.
          - arch: x86_64
            cpu: SandyBridge
            features: ssse3 sse4.1 aes pclmulqdq avx
          # AVX2 and BMI2 without ADX.
          - arch: x86_64
            cpu: Haswell
            features: ssse3 sse4.1 aes pclmulqdq avx avx2 bmi1 bmi2
          # ADX without the SHA extensions or VAES: Broadwell through
          # Comet Lake, and the Xeons of those years.
          - arch: x86_64
            cpu: Skylake-Client
            features: ssse3 sse4.1 aes pclmulqdq avx avx2 bmi1 bmi2 adx
          # An Atom: the SHA extensions without AVX.
          - arch: x86_64
            cpu: Denverton
            features: ssse3 sse4.1 aes pclmulqdq sha
          # The SHA extensions and ADX without VAES: Zen 1 and 2.
          # (QEMU's Milan model has no VAES either, so it would
          # decide the same.)
          - arch: x86_64
            cpu: EPYC-Rome
            features: >-
              ssse3 sse4.1 aes pclmulqdq avx avx2 bmi1 bmi2 adx sha
          # Everything QEMU emulates, which is VAES without
          # VPCLMULQDQ: the wide AES modes without wide GCM.
          - arch: x86_64
            cpu: max
            features: >-
              ssse3 sse4.1 aes pclmulqdq avx avx2 bmi1 bmi2 adx sha vaes
          # ARMv8.0 with the cryptography extension.
          - arch: aarch64
            cpu: cortex-a53
            features: aes pmull sha1 sha2
          # SHA-512 and SHA-3 as well, which is everything any
          # backend uses, so every row must run: one that cannot
          # would otherwise skip forever. (QEMU's `max` adds nothing
          # the library looks for.)
          - arch: aarch64
            cpu: neoverse-v1
            features: aes pmull sha1 sha2 sha512 sha3
            expect_all: 1
          # The RVA22 profile: of what the library looks for, Zbb.
          - arch: riscv64
            cpu: rva22u64
            features: zbb
          # The RVA23 profile: the vector extension, and Zvbb with
          # the Zvkb it includes.
          - arch: riscv64
            cpu: rva23u64
            features: v zbb zvbb zvkb
          # The vector and scalar cryptography extensions, which no
          # runner has and no profile requires: the only place these
          # kernels run at all, so this row is not a dispatch check
          # but RISC-V's one run of the library's tests, and the
          # processor also gets the check against the vendored
          # vectors, in the vendored-emulated job above.
          - arch: riscv64
            cpu: max
            features: >-
              v zbb zbc zbkb zbkc zkne zknd zknh zvkned zvknha zvknhb
              zvbb zvbc zvkb zvkg
            expect_all: 1
            whole: 1
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust, QEMU and the cross linker
        run: |
          # Debian names the architecture one way in the compiler's
          # package and another in the C library's.
          case ${{ matrix.arch }} in
              x86_64) target=x86_64-unknown-linux-gnu; cross= ;;
              aarch64)
                  target=aarch64-unknown-linux-gnu
                  cross="gcc-aarch64-linux-gnu libc6-dev-arm64-cross" ;;
              riscv64)
                  target=riscv64gc-unknown-linux-gnu
                  cross="gcc-riscv64-linux-gnu libc6-dev-riscv64-cross" ;;
          esac
          apt-get update
          apt-get install -y --no-install-recommends \
              ca-certificates curl gcc libc6-dev qemu-user zstd $cross
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal \
                    --default-toolchain stable --target "$target" \
                    --component clippy
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "TARGET=$target" >> "$GITHUB_ENV"

      # The rows of an architecture build the same thing and differ
      # only in the processor they run on, so they share one key.
      - uses: actions/cache/restore@v6
        id: cache
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: >-
            emulated-${{ matrix.arch }}-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Test as ${{ matrix.cpu }}
        # Cargo reads the linker and the runner from variables named
        # for the target. The inventory goes first and alone so that
        # its table is in the log. Then the dispatch check, or on
        # the `whole` row the library's tests.
        run: |
          arch=${{ matrix.arch }}
          name=$(echo "$TARGET" | tr 'a-z-' 'A-Z_')
          runner="qemu-$arch -cpu ${{ matrix.cpu }}"
          if [ "$arch" != x86_64 ]; then
              runner="$runner -L /usr/$arch-linux-gnu"
              export "CARGO_TARGET_${name}_LINKER=$arch-linux-gnu-gcc"
          fi
          export "CARGO_TARGET_${name}_RUNNER=$runner"
          cargo test --release -p scytale --lib --target "$TARGET" \
              -- --nocapture vectors::inventory
          alone=features::tests::alone
          if [ -n "${{ matrix.whole }}" ]; then
              cargo test --release --workspace --exclude scytale-acvp \
                  --lib --target "$TARGET" -- --skip vectors::inventory
              alone="$alone vectors::alone"
          else
              cargo test --release -p scytale --lib --target "$TARGET" \
                  agree
          fi
          cargo test --release -p scytale --lib --target "$TARGET" \
              -- $alone --ignored --test-threads=1
        env:
          SCYTALE_CPU_FEATURES: ${{ matrix.features }}
          # Empty for the rows that do not set it, which the
          # inventory reads as unset.
          SCYTALE_EXPECT_ALL: ${{ matrix.expect_all }}

      - name: Clippy
        # The lints for the target, which the native runner used to
        # run; once per architecture is enough.
        if: matrix.arch == 'riscv64' && matrix.cpu == 'max'
        run: |
          cargo clippy --workspace --exclude scytale-acvp --all-targets \
              --release --target "$TARGET" -- -D warnings
          cargo clippy -p scytale-acvp --no-default-features \
              --all-targets --release --target "$TARGET" \
              -- -D warnings

      - uses: actions/cache/save@v6
        # Saved once per key, by one job of those that share it.
        if: ${{ (matrix.cpu == 'max' || matrix.cpu == 'neoverse-v1') && steps.cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ steps.cache.outputs.cache-primary-key }}

  # Targets the jobs above do not build. wasm32 is an architecture
  # with no loops written out for it, which is a different shape of
  # build: the engine enums have only their one generic variant, the
  # helpers that only hardware backends call go unused, and `usize`
  # is thirty-two bits. The other three have the same assembly as
  # above but no operating system, so the probes that ask one and
  # the entropy source take their bare-metal arms. Nothing here
  # runs, because these have nowhere to run; building is what
  # catches it.
  other-targets:
    name: build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - wasm32-unknown-unknown
          - x86_64-unknown-none
          - aarch64-unknown-none
          - riscv64gc-unknown-none-elf
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: |
          rustup update --no-self-update stable
          rustup default stable
          rustup target add ${{ matrix.target }}

      - uses: actions/cache/restore@v6
        id: cache
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: >-
            build-${{ matrix.target }}-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build -p scytale --target ${{ matrix.target }}
        env:
          RUSTFLAGS: -D warnings

      - uses: actions/cache/save@v6
        # Saved once per key, by one job of those that share it.
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ steps.cache.outputs.cache-primary-key }}

  # Architecture-independent checks, so once is enough.
  style:
    name: style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: |
          rustup update --no-self-update stable
          rustup default stable
          rustup component add rustfmt

      - name: Formatting
        run: cargo fmt --all --check

      - name: Line length
        # ring-tests holds ring's own files, under ring's rules, so
        # only the shim's sources are held to this repository's.
        run: |
          long=$(find scytale scytale-cli scytale-acvp scytale-ring/src \
              rustls-scytale -name '*.rs' \
              -exec awk 'length > 80 {print FILENAME": "FNR}' {} +)
          if [ -n "$long" ]; then
              echo "lines over 80 columns:" >&2
              echo "$long" >&2
              exit 1
          fi

      - name: ASCII only
        run: |
          if grep -rnP --include='*.rs' '[^\x00-\x7F]' \
              scytale/src scytale-cli/src scytale-acvp/src \
              scytale-ring/src rustls-scytale/src rustls-scytale/tests; then
              echo "non-ASCII characters found" >&2
              exit 1
          fi

      - name: Manual rendering
        # scytale.1.md is generated from scytale.1 for reading on
        # GitHub; a change to the troff without regenerating it is
        # caught here.
        run: |
          command -v pandoc > /dev/null || sudo apt-get install -y pandoc
          scripts/man-md
          git diff --exit-code -- scytale-cli/scytale.1.md

  # rustls-webpki and rustls run their own test suites with
  # scytale-ring as their ring. Their tests are not in the published
  # crates, so the script clones each at its release tag.
  ring-downstream:
    name: test (rustls and webpki on scytale-ring)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: |
          rustup update --no-self-update stable
          rustup default stable

      - name: Test
        run: scripts/test-ring-downstream

  # rustls's own API suite and BoGo, BoringSSL's TLS test runner, with
  # rustls-scytale as the provider. Neither is in the published
  # crate, so the script clones rustls at the release's commit.
  rustls-downstream:
    name: test (rustls and BoGo on rustls-scytale)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: |
          rustup update --no-self-update stable
          rustup default stable

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          # This repository has no go.mod, so the action's module
          # cache has nothing to key on and only warns.
          cache: false

      - name: Test
        run: scripts/test-rustls-downstream

  # Every rustls-scytale suite against OpenSSL, both ways. BoGo cannot
  # reach the AES-CCM suites, BoringSSL having none, so this is where
  # another implementation reads their records.
  openssl-interop:
    name: test (rustls-scytale against OpenSSL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: |
          rustup update --no-self-update stable
          rustup default stable

      - name: Test
        run: |
          openssl version
          scripts/test-openssl-interop

  # The published crate omits the vendored vectors, so check that it
  # still builds and that nothing else went missing.
  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: |
          rustup update --no-self-update stable
          rustup default stable

      - name: Package and build the crates as published
        # Packaged together, each crate is built against scytale as it
        # will be published, not the copy beside it, which is what
        # anyone who installs it gets; a crate that uses library code
        # the release would not carry fails here, not at publish.
        #
        # Without the lock file: the provider and the tool ship one,
        # and between releases it names a scytale version crates.io
        # already has, so the check would build against that rather
        # than the code being packaged. At a release the version is
        # new and the lock file is harmless.
        run: |
          cargo package --exclude-lockfile -p scytale -p scytale-ring \
              -p rustls-scytale -p scytale-cli

      - name: Report crate size
        run: ls -lh target/package/*.crate
