[alias]
# Runs every test, including the long ones marked #[ignore]. Two
# ignored groups are left out: the benchmark, which measures rather
# than checks (use scripts/bench), and the tests that edit the
# features in force, which must run alone (see test-alone). The quick
# ACVP checks are left out too: the extended one answers every case
# they do and more.
test-extended = [
    "test", "--release", "--workspace", "--",
    "--include-ignored", "--skip", "bench::speed",
    "--skip", "features::tests::alone",
    "--skip", "profile::tests::every_profile",
    "--skip", "tests::vendored",
]
# The tests that edit the process-wide set of features in force, run
# single-threaded so that no other test sees a narrowed set.
test-alone = [
    "test", "--release", "-p", "scytale", "--lib",
    "features::tests::alone", "--", "--ignored", "--test-threads=1",
]
# The ACVP suites under every implementation this processor can run,
# which edits the same process-wide set; see scytale-acvp/README.md.
test-every-profile = [
    "test", "--release", "-p", "scytale-acvp", "--lib",
    "profile::tests::every_profile", "--", "--ignored", "--test-threads=1",
]
