[alias]
# Runs every test, including the long ones marked #[ignore]. Three
# ignored groups are left out: the benchmark, which measures rather
# than checks (use scripts/bench), the tests that edit the features
# in force, which must run alone (see test-alone), and the printer
# that generates the curves' base tables, which is how that file is
# made rather than a check on it. The quick ACVP checks are left out
# too: the full run, test-every-profile, answers every case they do
# and more.
test-extended = [
    "test", "--release", "--workspace", "--",
    "--include-ignored", "--skip", "bench::speed",
    "--skip", "print_base_tables",
    "--skip", "features::tests::alone",
    "--skip", "profile::tests::alone",
    "--skip", "tests::vendored",
]
# The tests that edit the process-wide set of features in force, run
# single-threaded so that no other test sees a narrowed set.
test-alone = [
    "test", "--release", "-p", "scytale", "--lib",
    "features::tests::alone", "--", "--ignored", "--test-threads=1",
]
# The full ACVP run: every suite in full under every implementation
# this processor can run, pooled across its cores, which edits the
# same process-wide set; takes SCYTALE_SHARD; see
# scytale-acvp/README.md.
test-every-profile = [
    "test", "--release", "-p", "scytale-acvp", "--lib",
    "profile::tests::alone", "--", "--ignored", "--test-threads=1",
    "--nocapture",
]
